name: Screenshots
# Manual design preview: synthetic demo data, four tabs in light and dark, uploaded as an artifact.
on:
  workflow_dispatch:
permissions:
  # Writes only the design-shots branch, so the images can be fetched with git as well as downloaded.
  contents: write
env:
  SDK_PACKAGES: "platforms;android-36 build-tools;36.0.0 platform-tools"
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install $SDK_PACKAGES
      - uses: gradle/actions/setup-gradle@v6
      - run: bash ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/ci-shots.sh shots
      - uses: actions/upload-artifact@v7
        with:
          name: fluxo-shots
          path: shots/*.png
          retention-days: 7
      - name: Publish to the design-shots branch
        run: |
          SRC="$(git rev-parse --short HEAD)"
          cd shots
          git init -q -b design-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          git commit -q -m "capturas de $SRC"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" design-shots
